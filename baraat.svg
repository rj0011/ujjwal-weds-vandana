<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 320 184" width="320" height="184">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a3"/><stop offset="1" stop-color="#d9a441"/></linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e1d6"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2344f"/><stop offset="1" stop-color="#a3172f"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8862b"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#c99532"/></linearGradient>
  <g id="note"><path d="M0 0 v-12 l8 -3 v12" fill="none" stroke="#ffd56b" stroke-width="1.6"/><ellipse cx="-2" cy="0" rx="3" ry="2.2" fill="#ffd56b"/><ellipse cx="6" cy="-3" rx="3" ry="2.2" fill="#ffd56b"/></g>
</defs>

<!-- floating music notes -->
<g opacity="0">
  <use href="#note" x="40" y="70"/>
  <animateTransform attributeName="transform" type="translate" values="0 0; 6 -40" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
</g>
<g opacity="0">
  <use href="#note" x="95" y="62"/>
  <animateTransform attributeName="transform" type="translate" values="0 0; -4 -42" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
</g>
<g opacity="0">
  <use href="#note" x="20" y="55"/>
  <animateTransform attributeName="transform" type="translate" values="0 0; 8 -36" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
</g>

<!-- trumpet player -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" repeatCount="indefinite"/>
  <!-- legs walking -->
  <path d="M30 128 L26 150" stroke="#1d2340" stroke-width="5" stroke-linecap="round"><animate attributeName="d" values="M30 128 L24 150;M30 128 L36 150;M30 128 L24 150" dur="0.5s" repeatCount="indefinite"/></path>
  <path d="M36 128 L40 150" stroke="#2b3256" stroke-width="5" stroke-linecap="round"><animate attributeName="d" values="M36 128 L42 150;M36 128 L30 150;M36 128 L42 150" dur="0.5s" repeatCount="indefinite"/></path>
  <path d="M22 96 Q33 90 44 96 L42 130 L24 130 Z" fill="url(#red)"/>
  <path d="M24 104 H42 M24 112 H42 M24 120 H42" stroke="#ffd56b" stroke-width="1.2"/>
  <circle cx="33" cy="84" r="8" fill="#c98e62"/>
  <path d="M24 80 Q33 70 42 80 Z" fill="#a3172f"/><rect x="23" y="78" width="20" height="4" rx="2" fill="#ffd56b"/>
  <!-- trumpet -->
  <path d="M40 90 L60 78" stroke="url(#brass)" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 79 L70 66 L74 74 Z" fill="url(#brass)"/>
  <path d="M40 104 Q48 96 52 84" stroke="#a3172f" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>

<!-- dhol player -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 -2;0 1;0 -2" dur="0.5s" begin="0.25s" repeatCount="indefinite"/>
  <path d="M84 128 L80 150" stroke="#1d2340" stroke-width="5" stroke-linecap="round"><animate attributeName="d" values="M84 128 L90 150;M84 128 L78 150;M84 128 L90 150" dur="0.5s" repeatCount="indefinite"/></path>
  <path d="M90 128 L94 150" stroke="#2b3256" stroke-width="5" stroke-linecap="round"><animate attributeName="d" values="M90 128 L84 150;M90 128 L96 150;M90 128 L84 150" dur="0.5s" repeatCount="indefinite"/></path>
  <path d="M76 96 Q87 90 98 96 L96 130 L78 130 Z" fill="url(#red)"/>
  <circle cx="87" cy="84" r="8" fill="#b9805a"/>
  <path d="M78 80 Q87 70 96 80 Z" fill="#a3172f"/><rect x="77" y="78" width="20" height="4" rx="2" fill="#ffd56b"/>
  <!-- strap -->
  <path d="M80 96 L100 116" stroke="#ffd56b" stroke-width="2"/>
  <!-- dhol drum -->
  <rect x="92" y="106" width="30" height="20" rx="9" fill="#8a3b1c"/>
  <ellipse cx="92" cy="116" rx="4" ry="10" fill="#f2e2c4"/><ellipse cx="122" cy="116" rx="4" ry="10" fill="#f2e2c4"/>
  <path d="M95 108 L119 124 M95 124 L119 108" stroke="#ffd56b" stroke-width="1.4"/>
  <!-- drumstick arm -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-18 98 100;12 98 100;-18 98 100" dur="0.25s" repeatCount="indefinite"/>
    <path d="M96 100 L114 96" stroke="#a3172f" stroke-width="5" stroke-linecap="round"/>
    <path d="M113 96 L128 104" stroke="#6b3a1a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</g>

<!-- HORSE + GROOM (galloping bob) -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.5s" repeatCount="indefinite"/>

  <!-- tail -->
  <path d="M152 88 Q128 92 126 120 Q138 104 150 100 Z" fill="#d8cfc2">
    <animate attributeName="d" values="M152 88 Q128 92 126 120 Q138 104 150 100 Z;M152 88 Q124 84 118 108 Q136 98 150 100 Z;M152 88 Q128 92 126 120 Q138 104 150 100 Z" dur="0.5s" repeatCount="indefinite"/>
  </path>

  <!-- far legs (darker) gallop frames -->
  <g fill="none" stroke="#cfc6b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 108 L160 128 L150 140"><animate attributeName="d" values="M170 108 L160 128 L150 140;M170 108 L176 130 L172 150;M170 108 L188 124 L196 136;M170 108 L160 128 L150 140" dur="0.5s" repeatCount="indefinite"/></path>
    <path d="M228 106 L240 124 L254 128"><animate attributeName="d" values="M228 106 L240 124 L254 128;M228 106 L232 130 L226 150;M228 106 L216 126 L208 140;M228 106 L240 124 L254 128" dur="0.5s" repeatCount="indefinite"/></path>
  </g>

  <!-- body -->
  <ellipse cx="200" cy="96" rx="52" ry="22" fill="url(#coat)"/>
  <!-- neck + head -->
  <path d="M232 92 Q238 66 252 52 L262 46 Q274 44 282 56 L290 66 Q292 72 286 74 L274 70 Q264 72 258 82 Q250 96 244 104 Z" fill="url(#coat)"/>
  <path d="M256 46 L258 34 L264 44 Z" fill="#e9e1d6"/>
  <circle cx="273" cy="56" r="2" fill="#2a1c14"/>
  <!-- mane -->
  <path d="M254 50 Q240 56 236 76 Q232 86 232 92 Q242 74 246 66 Q250 58 258 50 Z" fill="#d4a04a"/>
  <!-- bridle + kalgi plume -->
  <path d="M262 48 L284 70 M266 64 L280 54" stroke="#e2344f" stroke-width="2.2"/>
  <path d="M258 42 Q252 26 262 18 Q262 30 266 40 Z" fill="#e2344f"/>
  <circle cx="261" cy="44" r="3" fill="#ffd56b"/>

  <!-- saddle cloth -->
  <path d="M170 76 Q200 70 226 76 L230 112 Q200 120 166 112 Z" fill="url(#red)"/>
  <path d="M168 108 Q200 116 230 108" stroke="#ffd56b" stroke-width="3" fill="none"/>
  <g fill="#ffd56b"><circle cx="176" cy="114" r="2.5"/><circle cx="188" cy="117" r="2.5"/><circle cx="200" cy="118" r="2.5"/><circle cx="212" cy="117" r="2.5"/><circle cx="224" cy="114" r="2.5"/></g>
  <path d="M232 78 Q240 90 236 100" stroke="#ffd56b" stroke-width="3" fill="none"/>

  <!-- near legs gallop frames -->
  <g fill="none" stroke="url(#coat)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 110 L190 128 L200 138"><animate attributeName="d" values="M178 110 L190 128 L200 138;M178 110 L168 130 L158 142;M178 110 L182 132 L178 152;M178 110 L190 128 L200 138" dur="0.5s" repeatCount="indefinite"/></path>
    <path d="M236 104 L228 128 L222 146"><animate attributeName="d" values="M236 104 L228 128 L222 146;M236 104 L250 120 L262 122;M236 104 L240 128 L236 150;M236 104 L228 128 L222 146" dur="0.5s" repeatCount="indefinite"/></path>
  </g>

  <!-- GROOM -->
  <!-- leg over horse -->
  <path d="M196 78 Q206 92 204 106" stroke="#f3e3bd" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M202 106 L210 108" stroke="#7a1a2a" stroke-width="5" stroke-linecap="round"/>
  <!-- sherwani -->
  <path d="M184 40 Q196 34 208 40 L212 80 Q196 86 182 80 Z" fill="url(#gold)"/>
  <path d="M196 38 V82" stroke="#b8862b" stroke-width="1.5"/>
  <g fill="#a3172f"><circle cx="196" cy="48" r="1.6"/><circle cx="196" cy="58" r="1.6"/><circle cx="196" cy="68" r="1.6"/></g>
  <!-- dupatta -->
  <path d="M186 42 Q200 60 210 78" stroke="#e2344f" stroke-width="4" fill="none"/>
  <!-- arm with reins -->
  <path d="M206 46 Q222 56 236 62" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M236 62 Q252 60 266 62" stroke="#7a3a1a" stroke-width="1.5" fill="none"/>
  <!-- head -->
  <circle cx="198" cy="26" r="9" fill="#d9a07a"/>
  <!-- pagdi (turban) -->
  <path d="M186 24 Q186 8 198 8 Q212 8 210 24 Q198 18 186 24 Z" fill="url(#red)"/>
  <path d="M188 20 Q198 12 209 20" stroke="#ffd56b" stroke-width="2" fill="none"/>
  <path d="M202 9 Q210 -2 206 -8 Q214 0 206 10 Z" fill="#ffd56b"/>
  <circle cx="200" cy="12" r="2.5" fill="#fff"/>
  <!-- sehra strings -->
  <g stroke="#fff6dc" stroke-width="1.3">
    <animateTransform attributeName="transform" type="rotate" values="-4 198 22;4 198 22;-4 198 22" dur="0.5s" repeatCount="indefinite"/>
    <path d="M200 22 V40 M203 22 V39 M206 22 V37 M209 22 V34"/>
    <g fill="#ffd56b" stroke="none"><circle cx="200" cy="40" r="1.3"/><circle cx="203" cy="39" r="1.3"/><circle cx="206" cy="37" r="1.3"/><circle cx="209" cy="34" r="1.3"/></g>
  </g>
</g>

<!-- dust puffs behind hooves -->
<g fill="#e8d6b8">
  <circle cx="150" cy="150" r="3" opacity="0"><animate attributeName="r" values="2;8" dur="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="0.5s" repeatCount="indefinite"/><animate attributeName="cx" values="156;140" dur="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="152" r="3" opacity="0"><animate attributeName="r" values="2;7" dur="0.5s" begin=".25s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="0.5s" begin=".25s" repeatCount="indefinite"/><animate attributeName="cx" values="214;198" dur="0.5s" begin=".25s" repeatCount="indefinite"/></circle>
</g>
</svg>
